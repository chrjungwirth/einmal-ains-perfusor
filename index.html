<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfusor · Einmal AINS</title>
<meta name="description" content="Perfusor-Rechner für Anästhesie und Intensivmedizin: Dosis und Laufrate, offline nutzbar.">
<meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1416" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Perfusor">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/IBMPlexSans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/IBMPlexMono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen)
  try {
    var s = JSON.parse(localStorage.getItem('ea-perfusor-v1') || 'null');
    if (s && (s.theme === 'light' || s.theme === 'dark')) document.documentElement.setAttribute('data-theme', s.theme);
  } catch (e) {}
</script>
</head>
<body>
<header class="app-header">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Perfusor – zur Medikamentenliste">
      <img src="icons/mark.svg" alt="" width="34" height="34">
      <span class="brand__text"><span class="brand__eyebrow">Einmal AINS</span><span class="brand__name">Perfusor</span></span>
    </a>
    <div id="header-right" style="display:flex;gap:2px"></div>
  </div>
</header>
<main>
  <div class="wrap view" id="view">
    <noscript><p>Diese App benötigt JavaScript.</p></noscript>
  </div>
</main>
<div class="toast-host" id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
